name: Verify

# Gate repo AGENTS.md: type-check + lint + test berjalan di CI untuk tiap PR,
# bukan hanya atas disiplin lokal. Push ke main ikut dijaga karena deploy.yml
# berjalan untuk tiap push main (mencegah direct-push yang melewati PR).
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: type-check, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the delta gates diff the PR against its base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (app + worker)
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Repo gates (delta + API contract)
        # Delta gates (loc / any-delta / i18n / worker-strings) compare the PR
        # diff against its base; the API contract is whole-tree and runs on
        # every event. check:loc runs here too: with `--base` the grandfather
        # rule is mechanical (a >400 LOC file passes only if it strictly shrank
        # against the branch point), so CI needs no human judgement to enforce
        # it - see docs/agents/guardrails.md.
        # The whole-tree invariants (workflows / test-i18n / doc-refs /
        # ocr-constants) are file-level facts, not delta facts: a comment that
        # cites a deleted script or a re-declared geometry constant is wrong no
        # matter which PR introduced it, so they scan the tree on every event.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only "$BASE"...HEAD -- src shared worker scripts 2>/dev/null | tr '\n' ' ' || true)
          if [ -n "$FILES" ]; then
            node scripts/check-loc.mjs --base "$BASE" $FILES
            node scripts/check-any-delta.mjs --base "$BASE" $FILES
            node scripts/check-i18n.mjs --base "$BASE" $FILES
            node scripts/check-worker-strings.mjs --base "$BASE" $FILES
            node scripts/check-rbac-delta.mjs --base "$BASE" $FILES
          fi
          node scripts/check-workflows.mjs
          node scripts/check-test-i18n.mjs
          node scripts/check-doc-refs.mjs
          node scripts/check-ocr-constants.mjs
          node scripts/check-api-contract.mjs

      - name: Setup Bun (lockfile sync check)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Lockfile sync check (bun frozen)
        run: bun install --frozen-lockfile

      - name: Dead-code audit (Knip, warn-first)
        run: npm run knip
