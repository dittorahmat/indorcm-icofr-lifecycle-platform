<VirtualHost *:80>
    ServerName icofr.dsintegra.co.id
    DocumentRoot /home/ubuntu/indorcm-icofr-lifecycle-platform/dist/client

    <Directory /home/ubuntu/indorcm-icofr-lifecycle-platform/dist/client>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Security Headers
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header unset X-Powered-By

        # SPA Routing: Redirect all requests to index.html if file doesn't exist
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Proxy API requests to Hono backend
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /api http://localhost:3001/api
    ProxyPassReverse /api http://localhost:3001/api

    ErrorLog ${APACHE_LOG_DIR}/icofr_error.log
    CustomLog ${APACHE_LOG_DIR}/icofr_access.log combined
</VirtualHost>
